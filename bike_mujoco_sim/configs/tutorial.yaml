# Settings for the lessons. You edit the pid_ numbers.
# Starts weak on purpose: the bicycle tries to stay up, then falls.
# The balance rule decides how fast the handlebars should turn.
# A smaller rule inside the motor turns that speed into a twist.
# Edit pid_kp_roll, pid_ki_roll, pid_kd_roll, and pid_kp_steer.

balance_mode: cascade

duration: 10.0
control_dt: 0.02
record_dt: 0.02
balance_start_time: 0.0

wheel_radius: 0.07
target_speed: 2.2
acceleration_time: 1.76
min_scheduling_speed: 1.0

max_steer_velocity: 12.0
steer_kp: 0.03440724167520511
steer_ki: 0.021304688728578564
steer_integral_limit: 8.0
rear_kp: 0.25
rear_torque_limit: 2.5
steer_torque_limit: 7.98
steer_velocity_limit: 23.9
steer_joint_damping: 0.01890537736008028

sensor_to_bike_rpy_deg: [0.0, 0.0, 0.0]
gyro_bias_sensor_dps: [0.0, 0.0, 0.0]

# Weak on purpose: the bicycle struggles for less than a second, then falls.
# To catch the fall, raise pid_kd_roll and keep pid_kp_roll near 7.5.
pid_kp_roll: 5.0
pid_ki_roll: 0.0
pid_kd_roll: 6.0
pid_kp_steer: 1.1164231977942145
pid_integral_limit: 5.0
steer_rate_damping: 0.0

speed_goal_step: 0.15
speed_goal_min: -1.0
speed_goal_max: 3.5
steer_ref_step: 0.05
steer_ref_limit: 0.7
heading_step: 0.262
heading_kp: 1.5
heading_ki: 0.3
heading_stick_rate: 1.5
low_speed_upright: 0.1
